<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TauOS Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="icon" type="image/svg+xml" href="tauos-logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Mobile Container */
        .mobile-container {
            width: 100%;
            height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time {
            font-weight: 600;
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Home Screen */
        .home-screen {
            height: calc(100vh - 44px - 83px);
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .home-screen::-webkit-scrollbar {
            display: none;
        }

        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px 0;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .app-icon:active {
            transform: scale(0.95);
        }

        .app-icon-container {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .app-icon:hover .app-icon-container {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.2);
        }

        .app-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Dock */
        .dock {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .dock-apps {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .dock-app {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .dock-app:active {
            transform: scale(0.9);
        }

        .dock-app:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.3);
        }

        /* Control Center */
        .control-center {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }

        .control-center.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .control-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .close-control {
            width: 30px;
            height: 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-item {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .control-item:active {
            transform: scale(0.95);
        }

        .control-icon {
            font-size: 32px;
            margin-bottom: 12px;
            color: #fbbf24;
        }

        .control-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .quick-action {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .quick-action:active {
            transform: scale(0.95);
        }

        .quick-action-icon {
            font-size: 24px;
            margin-bottom: 8px;
            color: #fbbf24;
        }

        .quick-action-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* App Modal */
        .app-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }

        .app-modal.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .app-modal-content {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 300px;
            margin: 0 auto;
        }

        .app-modal-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .app-modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .app-modal-description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .app-modal-button {
            background: linear-gradient(135deg, #fbbf24, #f97316);
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .app-modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
        }

        /* Gesture Indicators */
        .gesture-indicator {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 4px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gesture-indicator.show {
            opacity: 1;
        }

        /* Responsive Design */
        @media (max-width: 375px) {
            .app-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
            
            .app-icon-container {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            .dock-apps {
                gap: 15px;
            }
            
            .dock-app {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }

        /* Dark Mode Toggle */
        .dark-mode-toggle {
            position: fixed;
            top: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fbbf24;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .dark-mode-toggle:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="time" id="current-time">9:41</span>
            </div>
            <div class="status-right">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <div class="battery">
                    <i class="fas fa-battery-three-quarters"></i>
                    <span>85%</span>
                </div>
            </div>
        </div>

        <!-- Home Screen -->
        <div class="home-screen">
            <div class="app-grid" id="app-grid">
                <!-- Apps will be loaded dynamically -->
            </div>
        </div>

        <!-- Dock -->
        <div class="dock">
            <div class="dock-apps">
                <div class="dock-app" onclick="openApp('taumail')">
                    📧
                </div>
                <div class="dock-app" onclick="openApp('taucloud')">
                    ☁️
                </div>
                <div class="dock-app" onclick="openApp('taubrowser')">
                    🌐
                </div>
                <div class="dock-app" onclick="openApp('settings')">
                    ⚙️
                </div>
            </div>
        </div>

        <!-- Control Center -->
        <div class="control-center" id="control-center">
            <div class="control-header">
                <h2 class="control-title">Control Center</h2>
                <button class="close-control" onclick="closeControlCenter()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="control-grid">
                <div class="control-item" onclick="toggleWifi()">
                    <div class="control-icon">📶</div>
                    <div class="control-label">Wi-Fi</div>
                </div>
                <div class="control-item" onclick="toggleBluetooth()">
                    <div class="control-icon">📱</div>
                    <div class="control-label">Bluetooth</div>
                </div>
                <div class="control-item" onclick="toggleAirplane()">
                    <div class="control-icon">✈️</div>
                    <div class="control-label">Airplane</div>
                </div>
                <div class="control-item" onclick="toggleCellular()">
                    <div class="control-icon">📡</div>
                    <div class="control-label">Cellular</div>
                </div>
            </div>

            <div class="quick-actions">
                <div class="quick-action" onclick="openApp('taumail')">
                    <div class="quick-action-icon">📧</div>
                    <div class="quick-action-label">Mail</div>
                </div>
                <div class="quick-action" onclick="openApp('taucloud')">
                    <div class="quick-action-icon">☁️</div>
                    <div class="quick-action-label">Cloud</div>
                </div>
                <div class="quick-action" onclick="openApp('taubrowser')">
                    <div class="quick-action-icon">🌐</div>
                    <div class="quick-action-label">Browser</div>
                </div>
                <div class="quick-action" onclick="openApp('settings')">
                    <div class="quick-action-icon">⚙️</div>
                    <div class="quick-action-label">Settings</div>
                </div>
            </div>
        </div>

        <!-- App Modal -->
        <div class="app-modal" id="app-modal">
            <div class="app-modal-content">
                <div class="app-modal-icon" id="modal-icon">📱</div>
                <h3 class="app-modal-title" id="modal-title">App</h3>
                <p class="app-modal-description" id="modal-description">App description</p>
                <a href="#" class="app-modal-button" id="modal-button" onclick="launchApp()">Launch App</a>
            </div>
        </div>

        <!-- Gesture Indicator -->
        <div class="gesture-indicator" id="gesture-indicator"></div>

        <!-- Dark Mode Toggle -->
        <div class="dark-mode-toggle" onclick="toggleDarkMode()">
            <i class="fas fa-moon"></i>
        </div>

        <!-- Notification -->
        <div class="notification" id="notification">
            <div class="notification-header">
                <div class="notification-title" id="notification-title">TauOS</div>
                <div class="notification-time" id="notification-time">now</div>
            </div>
            <div class="notification-message" id="notification-message">Welcome to TauOS Mobile!</div>
        </div>

        <!-- Lock Screen -->
        <div class="lock-screen" id="lock-screen">
            <div></div>
            <div>
                <div class="lock-time" id="lock-time">9:41</div>
                <div class="lock-date" id="lock-date">Monday, December 16</div>
                <div class="lock-indicator">Swipe up to unlock</div>
                <div class="lock-slider" onclick="unlockDevice()">
                    <div class="lock-slider-text">→</div>
                </div>
            </div>
        </div>

        <!-- App Switcher -->
        <div class="app-switcher" id="app-switcher">
            <div class="app-switcher-header">
                <h2 class="app-switcher-title">App Switcher</h2>
                <button class="close-switcher" onclick="closeAppSwitcher()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="app-switcher-grid" id="app-switcher-grid">
                <!-- Apps will be loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Mobile UI JavaScript
        class TauOSMobile {
            constructor() {
                this.apps = [];
                this.currentApp = null;
                this.isDarkMode = true;
                this.init();
            }

            init() {
                this.loadApps();
                this.setupEventListeners();
                this.updateTime();
                this.setupGestures();
                this.showWelcomeNotification();
                
                // Update time every minute
                setInterval(() => this.updateTime(), 60000);
            }

            async loadApps() {
                try {
                    const response = await fetch('/api/apps');
                    const apps = await response.json();
                    this.apps = apps;
                    this.renderApps();
                } catch (error) {
                    console.error('Failed to load apps:', error);
                    // Fallback apps
                    this.apps = [
                        { id: 'taumail', name: 'TauMail', icon: '📧', url: 'http://localhost:3001', description: 'Secure email client' },
                        { id: 'taucloud', name: 'TauCloud', icon: '☁️', url: 'http://localhost:3002', description: 'File storage and sync' },
                        { id: 'tauid', name: 'TauID', icon: '🆔', url: 'http://localhost:3003', description: 'Identity management' },
                        { id: 'taustore', name: 'TauStore', icon: '🛍️', url: 'http://localhost:3004', description: 'App marketplace' },
                        { id: 'taubrowser', name: 'TauBrowser', icon: '🌐', url: 'http://localhost:3005', description: 'Privacy-first browser' },
                        { id: 'settings', name: 'Settings', icon: '⚙️', url: '#', description: 'System preferences' },
                        { id: 'terminal', name: 'Terminal', icon: '💻', url: '#', description: 'Command line interface' },
                        { id: 'files', name: 'Files', icon: '📁', url: '#', description: 'File manager' }
                    ];
                    this.renderApps();
                }
            }

            renderApps() {
                const appGrid = document.getElementById('app-grid');
                appGrid.innerHTML = '';

                this.apps.forEach(app => {
                    if (app.category !== 'system') {
                        const appElement = document.createElement('div');
                        appElement.className = 'app-icon';
                        appElement.onclick = () => this.openApp(app.id);
                        
                        appElement.innerHTML = `
                            <div class="app-icon-container">
                                ${app.icon}
                            </div>
                            <div class="app-name">${app.name}</div>
                        `;
                        
                        appGrid.appendChild(appElement);
                    }
                });
            }

            openApp(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) return;

                this.currentApp = app;
                
                // Show app modal
                document.getElementById('modal-icon').textContent = app.icon;
                document.getElementById('modal-title').textContent = app.name;
                document.getElementById('modal-description').textContent = app.description;
                document.getElementById('modal-button').href = app.url;
                document.getElementById('app-modal').classList.add('show');
            }

            launchApp() {
                const app = this.currentApp;
                if (app && app.url && app.url !== '#') {
                    window.open(app.url, '_blank');
                }
                this.closeAppModal();
            }

            closeAppModal() {
                document.getElementById('app-modal').classList.remove('show');
                this.currentApp = null;
            }

            setupEventListeners() {
                // Control center swipe down
                let startY = 0;
                let currentY = 0;
                let isDragging = false;

                document.addEventListener('touchstart', (e) => {
                    if (e.touches[0].clientY < 100) {
                        startY = e.touches[0].clientY;
                        isDragging = true;
                        document.getElementById('gesture-indicator').classList.add('show');
                    }
                });

                document.addEventListener('touchmove', (e) => {
                    if (isDragging) {
                        currentY = e.touches[0].clientY;
                        const diff = currentY - startY;
                        
                        if (diff > 50) {
                            this.openControlCenter();
                            isDragging = false;
                            document.getElementById('gesture-indicator').classList.remove('show');
                        }
                    }
                });

                document.addEventListener('touchend', () => {
                    isDragging = false;
                    document.getElementById('gesture-indicator').classList.remove('show');
                });

                // Close modals when clicking outside
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('control-center')) {
                        this.closeControlCenter();
                    }
                    if (e.target.classList.contains('app-modal')) {
                        this.closeAppModal();
                    }
                });
            }

            setupGestures() {
                // Add haptic feedback simulation
                document.addEventListener('touchstart', () => {
                    // Simulate haptic feedback
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                });
            }

            openControlCenter() {
                document.getElementById('control-center').classList.add('show');
            }

            closeControlCenter() {
                document.getElementById('control-center').classList.remove('show');
            }

            updateTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: false 
                });
                document.getElementById('current-time').textContent = timeString;
            }

            toggleDarkMode() {
                this.isDarkMode = !this.isDarkMode;
                const toggle = document.querySelector('.dark-mode-toggle i');
                toggle.className = this.isDarkMode ? 'fas fa-moon' : 'fas fa-sun';
                
                // Apply theme changes
                document.body.style.background = this.isDarkMode 
                    ? 'linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%)'
                    : 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%)';
            }

            showWelcomeNotification() {
                setTimeout(() => {
                    this.showNotification('TauOS Mobile', 'Welcome to your privacy-first mobile experience!');
                }, 1000);
            }

            showNotification(title, message) {
                document.getElementById('notification-title').textContent = title;
                document.getElementById('notification-message').textContent = message;
                document.getElementById('notification-time').textContent = 'now';
                
                const notification = document.getElementById('notification');
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }

            openAppSwitcher() {
                this.renderAppSwitcher();
                document.getElementById('app-switcher').classList.add('show');
            }

            closeAppSwitcher() {
                document.getElementById('app-switcher').classList.remove('show');
            }

            renderAppSwitcher() {
                const switcherGrid = document.getElementById('app-switcher-grid');
                switcherGrid.innerHTML = '';

                this.apps.forEach(app => {
                    const appElement = document.createElement('div');
                    appElement.className = 'app-switcher-item';
                    appElement.onclick = () => {
                        this.openApp(app.id);
                        this.closeAppSwitcher();
                    };
                    
                    appElement.innerHTML = `
                        <div class="app-switcher-icon">${app.icon}</div>
                        <div class="app-switcher-name">${app.name}</div>
                    `;
                    
                    switcherGrid.appendChild(appElement);
                });
            }

            lockDevice() {
                document.getElementById('lock-screen').classList.add('show');
                this.updateLockTime();
            }

            unlockDevice() {
                document.getElementById('lock-screen').classList.remove('show');
            }

            updateLockTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: false 
                });
                const dateString = now.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                
                document.getElementById('lock-time').textContent = timeString;
                document.getElementById('lock-date').textContent = dateString;
            }
        }

        // Global functions for onclick handlers
        function openApp(appId) {
            window.mobile.openApp(appId);
        }

        function launchApp() {
            window.mobile.launchApp();
        }

        function closeControlCenter() {
            window.mobile.closeControlCenter();
        }

        function toggleDarkMode() {
            window.mobile.toggleDarkMode();
        }

        function toggleWifi() {
