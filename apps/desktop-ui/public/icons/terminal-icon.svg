<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <filter id="terminalGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#terminalGradient)"/>
  
  <!-- Terminal window -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="#000000" filter="url(#terminalGlow)"/>
  
  <!-- Terminal header -->
  <rect x="12" y="16" width="40" height="8" rx="4" fill="#374151"/>
  
  <!-- Terminal controls -->
  <circle cx="16" cy="20" r="1.5" fill="#EF4444"/>
  <circle cx="20" cy="20" r="1.5" fill="#F59E0B"/>
  <circle cx="24" cy="20" r="1.5" fill="#10B981"/>
  
  <!-- Terminal content -->
  <text x="16" y="32" font-family="monospace" font-size="8" fill="#10B981">$ tauos --version</text>
  <text x="16" y="40" font-family="monospace" font-size="8" fill="#FFFFFF">TauOS v1.0.0</text>
  <text x="16" y="48" font-family="monospace" font-size="8" fill="#10B981">$ _</text>
  
  <!-- Cursor blink effect -->
  <rect x="20" y="44" width="2" height="4" fill="#10B981" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
