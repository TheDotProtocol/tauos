<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="idGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="idGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#idGradient)"/>
  
  <!-- ID card -->
  <rect x="16" y="20" width="32" height="24" rx="4" fill="white" filter="url(#idGlow)"/>
  
  <!-- ID card details -->
  <circle cx="28" cy="28" r="4" fill="url(#idGradient)"/>
  <path d="M24 36 L40 36" stroke="url(#idGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 38 L38 38" stroke="url(#idGradient)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Security shield -->
  <path d="M32 16 L36 18 L36 22 C36 26 34 28 32 30 C30 28 28 26 28 22 L28 18 Z" fill="white" opacity="0.8"/>
  <path d="M32 20 L34 22 L34 24 L32 26 L30 24 L30 22 Z" fill="url(#idGradient)"/>
  
  <!-- Shine effect -->
  <rect x="16" y="20" width="32" height="8" rx="4" fill="white" opacity="0.1"/>
</svg>
