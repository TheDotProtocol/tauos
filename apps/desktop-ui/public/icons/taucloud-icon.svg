<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="cloudGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#cloudGradient)"/>
  
  <!-- Cloud shape -->
  <path d="M20 32 C20 28 24 24 28 24 C28 20 32 16 36 16 C40 16 44 20 44 24 C48 24 52 28 52 32 C52 36 48 40 44 40 L20 40 C16 40 12 36 12 32 C12 28 16 24 20 24 Z" fill="white" filter="url(#cloudGlow)"/>
  
  <!-- Cloud details -->
  <path d="M28 28 L36 28 L36 36 L28 36 Z" fill="url(#cloudGradient)"/>
  <path d="M30 30 L34 30 L34 34 L30 34 Z" fill="white"/>
  
  <!-- Upload arrow -->
  <path d="M32 20 L32 28 M28 24 L32 20 L36 24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  
  <!-- Shine effect -->
  <ellipse cx="32" cy="28" rx="8" ry="4" fill="white" opacity="0.1"/>
</svg>
