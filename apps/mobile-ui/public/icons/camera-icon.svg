<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <filter id="cameraGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#cameraGradient)"/>
  
  <!-- Camera body -->
  <rect x="16" y="20" width="32" height="24" rx="4" fill="white" filter="url(#cameraGlow)"/>
  
  <!-- Camera lens -->
  <circle cx="32" cy="32" r="8" fill="url(#cameraGradient)"/>
  <circle cx="32" cy="32" r="6" fill="white" opacity="0.8"/>
  <circle cx="32" cy="32" r="4" fill="url(#cameraGradient)"/>
  
  <!-- Flash -->
  <rect x="28" y="16" width="8" height="4" rx="2" fill="white" opacity="0.9"/>
  
  <!-- Viewfinder -->
  <rect x="20" y="24" width="24" height="2" rx="1" fill="url(#cameraGradient)" opacity="0.3"/>
  
  <!-- Shine effect -->
  <rect x="16" y="20" width="32" height="8" rx="4" fill="white" opacity="0.1"/>
</svg>
