[package]
name = "taubrowser"
version = "1.0.0-beta.1"
description = "Tau Browser — privacy-first cross-platform web browser"
authors = ["Tau Core Inc."]
edition = "2021"

[workspace]

[lib]
name = "taubrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
