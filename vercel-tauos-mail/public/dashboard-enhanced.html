<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TauMail - Privacy-First Email</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FFD700;
            --primary-dark: #FFA500;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-container {
            display: flex;
            height: 100vh;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(26, 26, 46, 0.9);
            border-right: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-nav {
            padding: 24px 0;
        }

        .nav-item {
            padding: 16px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: rgba(255, 215, 0, 0.2);
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .nav-count {
            margin-left: auto;
            background: rgba(255, 215, 0, 0.2);
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 20px;
            width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .search-input {
            border: none;
            background: none;
            outline: none;
            flex: 1;
            margin-left: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .compose-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compose-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: background 0.3s;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .user-menu:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
            font-size: 16px;
        }

        /* Email Content */
        .email-content {
            flex: 1;
            display: flex;
            background: rgba(15, 15, 35, 0.5);
        }

        .email-list {
            width: 400px;
            background: rgba(26, 26, 46, 0.8);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .email-item {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .email-item:hover {
            background: rgba(255, 215, 0, 0.05);
            transform: translateX(4px);
        }

        .email-item.unread {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid var(--primary-color);
        }

        .email-item.selected {
            background: rgba(255, 215, 0, 0.15);
            border-left: 3px solid var(--primary-color);
        }

        .email-sender {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .email-subject {
            color: var(--text-secondary);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .email-preview {
            color: var(--text-muted);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .email-time {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        .email-actions {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            gap: 8px;
        }

        .email-item:hover .email-actions {
            display: flex;
        }

        .email-action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .email-action-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            color: var(--primary-color);
            transform: scale(1.1);
        }

        /* Email Detail */
        .email-detail {
            flex: 1;
            background: rgba(15, 15, 35, 0.8);
            padding: 32px;
            overflow-y: auto;
        }

        .email-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .email-subject-large {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .email-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
        }

        .email-sender-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .email-body {
            line-height: 1.8;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .email-actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--success-color);
        }

        .toast.error {
            border-left: 4px solid var(--error-color);
        }

        .toast.warning {
            border-left: 4px solid var(--warning-color);
        }

        .toast-icon {
            font-size: 18px;
        }

        .toast.success .toast-icon {
            color: var(--success-color);
        }

        .toast.error .toast-icon {
            color: var(--error-color);
        }

        .toast.warning .toast-icon {
            color: var(--warning-color);
        }

        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-email {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .skeleton-line {
            height: 16px;
            margin-bottom: 8px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        .skeleton-line.medium {
            width: 80%;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
            }

            .sidebar.show {
                transform: translateX(280px);
            }

            .email-list {
                width: 100%;
            }

            .email-detail {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 999;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }

            .email-detail.show {
                transform: translateX(0);
            }

            .search-bar {
                width: 200px;
            }

            .header {
                padding: 12px 16px;
            }
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-envelope"></i>
                    τ Mail
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" data-folder="inbox">
                    <i class="fas fa-inbox nav-icon"></i>
                    Inbox
                    <span class="nav-count" id="inbox-count">0</span>
                </div>
                <div class="nav-item" data-folder="sent">
                    <i class="fas fa-paper-plane nav-icon"></i>
                    Sent
                    <span class="nav-count" id="sent-count">0</span>
                </div>
                <div class="nav-item" data-folder="starred">
                    <i class="fas fa-star nav-icon"></i>
                    Starred
                    <span class="nav-count" id="starred-count">0</span>
                </div>
                <div class="nav-item" data-folder="drafts">
                    <i class="fas fa-file-alt nav-icon"></i>
                    Drafts
                    <span class="nav-count" id="drafts-count">0</span>
                </div>
                <div class="nav-item" data-folder="trash">
                    <i class="fas fa-trash nav-icon"></i>
                    Trash
                    <span class="nav-count" id="trash-count">0</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input" placeholder="Search emails..." id="search-input">
                    </div>
                </div>
                <div class="header-right">
                    <button class="compose-btn" id="compose-btn">
                        <i class="fas fa-plus"></i>
                        Compose
                    </button>
                    <div class="user-menu" id="user-menu">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <span id="user-email">user@tauos.org</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- Email Content -->
            <div class="email-content">
                <!-- Email List -->
                <div class="email-list" id="email-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading emails...
                    </div>
                </div>

                <!-- Email Detail -->
                <div class="email-detail" id="email-detail">
                    <div class="loading">
                        <div class="spinner"></div>
                        Select an email to view
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Global variables
        let currentUser = null;
        let currentFolder = 'inbox';
        let emails = [];
        let selectedEmail = null;

        // Check authentication
        const token = localStorage.getItem('taumail_token');
        if (!token) {
            window.location.href = '/';
        }

        // Load user data
        const userData = localStorage.getItem('taumail_user');
        if (userData) {
            const user = JSON.parse(userData);
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('user-avatar').textContent = user.username.charAt(0).toUpperCase();
        }

        // Toast notification system
        function showToast(message, type = 'success', duration = 3000) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'check-circle' : 
                        type === 'error' ? 'exclamation-circle' : 
                        type === 'warning' ? 'exclamation-triangle' : 'info-circle';
            
            toast.innerHTML = `
                <i class="fas fa-${icon} toast-icon"></i>
                <span>${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 100);
            
            // Auto remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // API functions
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`/api${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                return response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        // Load emails with skeleton loading
        async function loadEmails(folder = 'inbox') {
            try {
                console.log('Loading emails for folder:', folder);
                
                // Show skeleton loading
                showSkeletonLoading();
                
                const endpoint = folder === 'sent' ? '/emails/sent' : '/emails/inbox';
                const data = await apiCall(endpoint);
                emails = data;
                console.log('Loaded emails:', data.length, 'emails');
                
                renderEmailList();
                updateCounts();
                
                if (data.length === 0) {
                    showEmptyState(folder);
                }
            } catch (error) {
                console.error('Failed to load emails:', error);
                showError('Failed to load emails');
                showEmptyState(folder, true);
            }
        }

        // Show skeleton loading
        function showSkeletonLoading() {
            const emailList = document.getElementById('email-list');
            emailList.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-email';
                skeleton.innerHTML = `
                    <div class="skeleton skeleton-line short"></div>
                    <div class="skeleton skeleton-line medium"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line short"></div>
                `;
                emailList.appendChild(skeleton);
            }
        }

        // Show empty state
        function showEmptyState(folder, isError = false) {
            const emailList = document.getElementById('email-list');
            const icon = isError ? 'exclamation-triangle' : 'inbox';
            const color = isError ? '#ef4444' : 'rgba(255,255,255,0.3)';
            const message = isError ? 'Failed to load emails' : `No emails in ${folder}`;
            
            emailList.innerHTML = `
                <div class="loading">
                    <i class="fas fa-${icon}" style="font-size: 48px; color: ${color}; margin-bottom: 16px;"></i>
                    <div>${message}</div>
                </div>
            `;
        }

        // Render email list
        function renderEmailList() {
            const emailList = document.getElementById('email-list');
            emailList.innerHTML = '';

            if (emails.length === 0) {
                showEmptyState(currentFolder);
                return;
            }

            emails.forEach(email => {
                const emailItem = document.createElement('div');
                emailItem.className = `email-item ${email.is_read ? '' : 'unread'}`;
                emailItem.dataset.emailId = email.id;
                
                const timeAgo = getTimeAgo(email.created_at);
                
                // Handle different email types (inbox vs sent)
                const displayName = currentFolder === 'sent' 
                    ? (email.recipient_name || email.recipient_email || 'Unknown Recipient')
                    : (email.sender_username || email.recipient_username || 'Unknown Sender');
                
                emailItem.innerHTML = `
                    <div class="email-sender">${displayName}</div>
                    <div class="email-subject">${email.subject}</div>
                    <div class="email-preview">${email.body.substring(0, 100)}${email.body.length > 100 ? '...' : ''}</div>
                    <div class="email-time">${timeAgo}</div>
                    <div class="email-actions">
                        <button class="email-action-btn" onclick="starEmail(${email.id})" title="Star">
                            <i class="fas fa-star ${email.is_starred ? 'fas' : 'far'}"></i>
                        </button>
                        <button class="email-action-btn" onclick="replyEmail(${email.id})" title="Reply">
                            <i class="fas fa-reply"></i>
                        </button>
                        <button class="email-action-btn" onclick="deleteEmail(${email.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                emailItem.addEventListener('click', () => selectEmail(email.id));
                emailList.appendChild(emailItem);
            });
        }

        // Select email
        async function selectEmail(emailId) {
            try {
                console.log('Selecting email with ID:', emailId, 'Current folder:', currentFolder);
                
                // Update selected state
                document.querySelectorAll('.email-item').forEach(item => item.classList.remove('selected'));
                document.querySelector(`[data-email-id="${emailId}"]`).classList.add('selected');
                
                const email = await apiCall(`/emails/${emailId}`);
                selectedEmail = email;
                renderEmailDetail(email);
                
                // Mark as read if not already (only for inbox emails)
                if (currentFolder !== 'sent' && !email.is_read) {
                    await apiCall(`/emails/${emailId}/read`, { method: 'PUT' });
                    loadEmails(currentFolder);
                }
                
                // Show email detail on mobile
                if (window.innerWidth <= 768) {
                    document.getElementById('email-detail').classList.add('show');
                }
            } catch (error) {
                console.error('Failed to load email:', error);
                showToast('Failed to load email', 'error');
            }
        }

        // Render email detail
        function renderEmailDetail(email) {
            const emailDetail = document.getElementById('email-detail');
            const timeAgo = getTimeAgo(email.created_at);
            
            // Handle different email types (inbox vs sent)
            const displayName = currentFolder === 'sent' 
                ? (email.recipient_name || email.recipient_email || 'Unknown Recipient')
                : (email.sender_username || email.recipient_username || 'Unknown Sender');
            
            const displayEmail = currentFolder === 'sent'
                ? email.recipient_email
                : (email.sender_email || email.recipient_email);
            
            emailDetail.innerHTML = `
                <div class="email-header">
                    <div class="email-subject-large">${email.subject}</div>
                    <div class="email-meta">
                        <div class="email-sender-info">
                            <div class="user-avatar">${displayName.charAt(0).toUpperCase()}</div>
                            <div>
                                <div>${displayName}</div>
                                <div>${displayEmail}</div>
                                ${currentFolder === 'sent' && email.smtp_status ? `<div style="font-size: 12px; color: var(--primary-color);">Status: ${email.smtp_status}</div>` : ''}
                            </div>
                        </div>
                        <div>${timeAgo}</div>
                    </div>
                </div>
                <div class="email-body">
                    ${email.body.replace(/\n/g, '<br>')}
                </div>
                <div class="email-actions-bar">
                    <button class="action-btn" onclick="replyEmail(${email.id})">
                        <i class="fas fa-reply"></i>
                        Reply
                    </button>
                    <button class="action-btn" onclick="forwardEmail(${email.id})">
                        <i class="fas fa-share"></i>
                        Forward
                    </button>
                    <button class="action-btn" onclick="starEmail(${email.id})">
                        <i class="fas fa-star ${email.is_starred ? 'fas' : 'far'}"></i>
                        ${email.is_starred ? 'Unstar' : 'Star'}
                    </button>
                    <button class="action-btn" onclick="deleteEmail(${email.id})">
                        <i class="fas fa-trash"></i>
                        Delete
                    </button>
                </div>
            `;
        }

        // Email actions
        async function starEmail(emailId) {
            try {
                await apiCall(`/emails/${emailId}/star`, { method: 'PUT' });
                showToast('Email starred successfully', 'success');
                loadEmails(currentFolder);
            } catch (error) {
                showToast('Failed to star email', 'error');
            }
        }

        async function replyEmail(emailId) {
            // TODO: Implement reply functionality
            showToast('Reply feature coming soon!', 'warning');
        }

        async function forwardEmail(emailId) {
            // TODO: Implement forward functionality
            showToast('Forward feature coming soon!', 'warning');
        }

        async function deleteEmail(emailId) {
            if (confirm('Are you sure you want to delete this email?')) {
                try {
                    await apiCall(`/emails/${emailId}`, { method: 'DELETE' });
                    showToast('Email deleted successfully', 'success');
                    loadEmails(currentFolder);
                } catch (error) {
                    showToast('Failed to delete email', 'error');
                }
            }
        }

        // Utility functions
        function getTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString();
        }

        function updateCounts() {
            const counts = {
                inbox: emails.filter(e => !e.is_read).length,
                sent: emails.length,
                starred: emails.filter(e => e.is_starred).length,
                drafts: 0,
                trash: 0
            };

            Object.keys(counts).forEach(folder => {
                const element = document.getElementById(`${folder}-count`);
                if (element) {
                    element.textContent = counts[folder];
                }
            });
        }

        // Mobile menu toggle
        document.getElementById('mobile-menu-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('show');
        });

        // Close email detail on mobile when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                const emailDetail = document.getElementById('email-detail');
                const emailList = document.getElementById('email-list');
                
                if (!emailDetail.contains(e.target) && !emailList.contains(e.target)) {
                    emailDetail.classList.remove('show');
                }
            }
        });

        // Event listeners
        document.getElementById('compose-btn').addEventListener('click', function() {
            // Open enhanced compose modal
            window.open('/compose-enhanced.html', '_blank', 'width=800,height=700,scrollbars=yes,resizable=yes');
        });

        document.getElementById('user-menu').addEventListener('click', function() {
            if (confirm('Do you want to logout?')) {
                localStorage.removeItem('taumail_token');
                localStorage.removeItem('taumail_user');
                window.location.href = '/';
            }
        });

        // Folder navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const folder = this.dataset.folder;
                if (folder) {
                    currentFolder = folder;
                    
                    // Update active state
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Load emails for folder
                    loadEmails(folder);
                    
                    // Close mobile menu
                    document.getElementById('sidebar').classList.remove('show');
                }
            });
        });

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const emailItems = document.querySelectorAll('.email-item');
            
            emailItems.forEach(item => {
                const sender = item.querySelector('.email-sender').textContent.toLowerCase();
                const subject = item.querySelector('.email-subject').textContent.toLowerCase();
                const preview = item.querySelector('.email-preview').textContent.toLowerCase();
                
                if (sender.includes(query) || subject.includes(query) || preview.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + N for new email
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                // TODO: Open compose modal
                showToast('Compose feature coming soon!', 'warning');
            }
            
            // Escape to close mobile email detail
            if (e.key === 'Escape' && window.innerWidth <= 768) {
                document.getElementById('email-detail').classList.remove('show');
            }
        });

        // Initialize
        loadEmails();
    </script>
