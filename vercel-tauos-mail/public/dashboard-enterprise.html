<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TauMail - Enterprise Email Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --white: #ffffff;
            --gray-50: #f8f9fa;
            --gray-100: #e9ecef;
            --gray-200: #dee2e6;
            --gray-300: #ced4da;
            --gray-400: #adb5bd;
            --gray-500: #6c757d;
            --gray-600: #495057;
            --gray-700: #343a40;
            --gray-800: #212529;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --text-muted: #adb5bd;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --border-color: #dee2e6;
            --shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --shadow-lg: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --border-radius: 0.375rem;
            --transition: all 0.15s ease-in-out;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--primary-color);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 0.875rem;
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 1.5rem;
        }

        .nav-section-title {
            padding: 0 1.5rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.625rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            transition: var(--transition);
            margin: 0 0.5rem;
            border-radius: var(--border-radius);
            position: relative;
        }

        .nav-item:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: var(--primary-color);
            border-radius: 0 2px 2px 0;
        }

        .nav-icon {
            width: 18px;
            text-align: center;
            font-size: 0.875rem;
        }

        .nav-label {
            flex: 1;
            font-size: 0.875rem;
        }

        .nav-count {
            background-color: var(--gray-200);
            color: var(--text-secondary);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
            line-height: 1.2;
        }

        .nav-item.active .nav-count {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--white);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
        }

        .header {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .search-container {
            position: relative;
            width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background-color: var(--bg-secondary);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--bg-primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .security-indicators {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background-color: #28a745;
            color: white;
            border-radius: var(--border-radius);
            font-weight: 500;
            font-size: 0.75rem;
            transition: var(--transition);
        }

        .security-badge.warning {
            background-color: #ffc107;
            color: #212529;
        }

        .security-badge.info {
            background-color: #17a2b8;
            color: white;
        }

        .compose-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 100px;
            justify-content: center;
        }

        .compose-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .user-menu:hover {
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .user-email {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .email-content {
            flex: 1;
            display: flex;
        }

        .email-list {
            width: 400px;
            border-right: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            overflow-y: auto;
        }

        .email-list-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
        }

        .email-list-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }

        .email-list-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .email-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .email-item:hover {
            background-color: var(--bg-secondary);
        }

        .email-item.selected {
            background-color: rgba(0, 123, 255, 0.05);
            border-left: 3px solid var(--primary-color);
        }

        .email-item.unread {
            background-color: rgba(0, 123, 255, 0.02);
        }

        .email-item.unread .email-sender {
            font-weight: 600;
        }

        .email-item.unread .email-subject {
            font-weight: 600;
        }

        .email-sender {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
            line-height: 1.3;
        }

        .email-subject {
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 500;
        }

        .email-preview {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .email-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .email-time {
            font-weight: 500;
        }

        .email-actions {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            gap: 0.25rem;
        }

        .email-item:hover .email-actions {
            display: flex;
        }

        .email-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.375rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.875rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .email-action-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .email-detail {
            flex: 1;
            background-color: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .email-detail-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
        }

        .email-detail-subject {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .email-detail-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .email-sender-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sender-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 600;
            font-size: 1rem;
        }

        .sender-details h4 {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
        }

        .sender-details p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.3;
        }

        .email-detail-time {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .email-detail-body {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            line-height: 1.7;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .email-detail-actions {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 80px;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--gray-400);
        }

        .action-btn.primary {
            background-color: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .action-btn.primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 3rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .empty-state-message {
            font-size: 0.875rem;
            max-width: 300px;
            line-height: 1.5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
        }

        .spinner {
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 1rem;
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: var(--shadow);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 300px;
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid #28a745;
        }

        .toast.error {
            border-left: 4px solid #dc3545;
        }

        .toast.warning {
            border-left: 4px solid #ffc107;
        }

        .toast-icon {
            font-size: 1.125rem;
        }

        .toast.success .toast-icon {
            color: #28a745;
        }

        .toast.error .toast-icon {
            color: #dc3545;
        }

        .toast.warning .toast-icon {
            color: #ffc107;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transition: transform 0.3s ease;
            }

            .sidebar.show {
                transform: translateX(280px);
            }

            .email-list {
                width: 100%;
            }

            .email-detail {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 999;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }

            .email-detail.show {
                transform: translateX(0);
            }

            .search-container {
                width: 200px;
            }

            .header {
                padding: 0.5rem 1rem;
            }
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.125rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.375rem;
        }

        .mobile-menu-toggle:hover {
            background-color: var(--bg-secondary);
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <span>TauMail</span>
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Mail</div>
                    <a href="#" class="nav-item active" data-folder="inbox">
                        <i class="fas fa-inbox nav-icon"></i>
                        <span class="nav-label">Inbox</span>
                        <span class="nav-count" id="inbox-count">0</span>
                    </a>
                    <a href="#" class="nav-item" data-folder="sent">
                        <i class="fas fa-paper-plane nav-icon"></i>
                        <span class="nav-label">Sent</span>
                        <span class="nav-count" id="sent-count">0</span>
                    </a>
                    <a href="#" class="nav-item" data-folder="drafts">
                        <i class="fas fa-file-alt nav-icon"></i>
                        <span class="nav-label">Drafts</span>
                        <span class="nav-count" id="drafts-count">0</span>
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Labels</div>
                    <a href="#" class="nav-item" data-folder="starred">
                        <i class="fas fa-star nav-icon"></i>
                        <span class="nav-label">Starred</span>
                        <span class="nav-count" id="starred-count">0</span>
                    </a>
                    <a href="#" class="nav-item" data-folder="important">
                        <i class="fas fa-exclamation nav-icon"></i>
                        <span class="nav-label">Important</span>
                        <span class="nav-count" id="important-count">0</span>
                    </a>
                    <a href="#" class="nav-item" data-folder="trash">
                        <i class="fas fa-trash nav-icon"></i>
                        <span class="nav-label">Trash</span>
                        <span class="nav-count" id="trash-count">0</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Search emails..." id="search-input">
                    </div>
                </div>
                <div class="header-right">
                    <div class="security-indicators">
                        <div class="security-badge">
                            <i class="fas fa-shield-alt"></i>
                            Trackers Blocked
                        </div>
                        <div class="security-badge">
                            <i class="fas fa-lock"></i>
                            E2E Encrypted
                        </div>
                        <div class="security-badge info">
                            <i class="fas fa-eye"></i>
                            Privacy Mode
                        </div>
                    </div>
                    <button class="compose-btn" id="compose-btn">
                        <i class="fas fa-plus"></i>
                        Compose
                    </button>
                    <div class="user-menu" id="user-menu">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <div class="user-info">
                            <div class="user-name" id="user-name">User</div>
                            <div class="user-email" id="user-email">user@tauos.org</div>
                        </div>
                        <i class="fas fa-chevron-down" style="font-size: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>
            </div>

            <div class="email-content">
                <div class="email-list" id="email-list">
                    <div class="email-list-header">
                        <div class="email-list-title">Inbox</div>
                        <div class="email-list-subtitle">0 messages</div>
                    </div>
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading emails...
                    </div>
                </div>

                <div class="email-detail" id="email-detail">
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-envelope-open"></i>
                        </div>
                        <div class="empty-state-title">Select an email to read</div>
                        <div class="empty-state-message">
                            Choose an email from the list to view its contents and take action.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // Global variables
        let currentUser = null;
        let currentFolder = 'inbox';
        let emails = [];
        let selectedEmail = null;

        // Check authentication
        const token = localStorage.getItem('taumail_token');
        if (!token) {
            window.location.href = '/';
        }

        // Load user data
        const userData = localStorage.getItem('taumail_user');
        if (userData) {
            const user = JSON.parse(userData);
            document.getElementById('user-name').textContent = user.username || 'User';
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('user-avatar').textContent = (user.username || 'U').charAt(0).toUpperCase();
        }

        // Toast notification system
        function showToast(message, type = 'success', duration = 3000) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'check-circle' : 
                        type === 'error' ? 'exclamation-circle' : 
                        type === 'warning' ? 'exclamation-triangle' : 'info-circle';
            
            toast.innerHTML = `
                <i class="fas fa-${icon} toast-icon"></i>
                <span>${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // API functions
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`/api${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                return response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        // Load emails
        async function loadEmails(folder = 'inbox') {
            try {
                console.log('Loading emails for folder:', folder);
                
                const endpoint = folder === 'sent' ? '/emails/sent' : '/emails/inbox';
                const data = await apiCall(endpoint);
                emails = data;
                console.log('Loaded emails:', data.length, 'emails');
                
                renderEmailList();
                updateCounts();
                updateEmailListHeader(folder);
                
                if (data.length === 0) {
                    showEmptyEmailList(folder);
                }
            } catch (error) {
                console.error('Failed to load emails:', error);
                showToast('Failed to load emails', 'error');
                showEmptyEmailList(folder, true);
            }
        }

        // Show empty email list
        function showEmptyEmailList(folder, isError = false) {
            const emailList = document.getElementById('email-list');
            const icon = isError ? 'exclamation-triangle' : 'inbox';
            const title = isError ? 'Failed to load emails' : `No emails in ${folder}`;
            const message = isError ? 'Please try again later' : `Your ${folder} is empty`;
            
            emailList.innerHTML = `
                <div class="email-list-header">
                    <div class="email-list-title">${folder.charAt(0).toUpperCase() + folder.slice(1)}</div>
                    <div class="email-list-subtitle">0 messages</div>
                </div>
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="fas fa-${icon}"></i>
                    </div>
                    <div class="empty-state-title">${title}</div>
                    <div class="empty-state-message">${message}</div>
                </div>
            `;
        }

        // Update email list header
        function updateEmailListHeader(folder) {
            const emailList = document.getElementById('email-list');
            const header = emailList.querySelector('.email-list-header');
            if (header) {
                const title = header.querySelector('.email-list-title');
                const subtitle = header.querySelector('.email-list-subtitle');
                
                title.textContent = folder.charAt(0).toUpperCase() + folder.slice(1);
                subtitle.textContent = `${emails.length} message${emails.length !== 1 ? 's' : ''}`;
            }
        }

        // Render email list
        function renderEmailList() {
            const emailList = document.getElementById('email-list');
            
            const header = emailList.querySelector('.email-list-header');
            emailList.innerHTML = '';
            if (header) emailList.appendChild(header);

            if (emails.length === 0) {
                showEmptyEmailList(currentFolder);
                return;
            }

            emails.forEach(email => {
                const emailItem = document.createElement('div');
                emailItem.className = `email-item ${email.is_read ? '' : 'unread'}`;
                emailItem.dataset.emailId = email.id;
                
                const timeAgo = getTimeAgo(email.created_at);
                
                const displayName = currentFolder === 'sent' 
                    ? (email.recipient_name || email.recipient_email || 'Unknown Recipient')
                    : (email.sender_username || email.recipient_username || 'Unknown Sender');
                
                emailItem.innerHTML = `
                    <div class="email-sender">${displayName}</div>
                    <div class="email-subject">${email.subject}</div>
                    <div class="email-preview">${email.body.substring(0, 120)}${email.body.length > 120 ? '...' : ''}</div>
                    <div class="email-meta">
                        <span class="email-time">${timeAgo}</span>
                    </div>
                    <div class="email-actions">
                        <button class="email-action-btn" onclick="starEmail(${email.id})" title="Star">
                            <i class="fas fa-star ${email.is_starred ? 'fas' : 'far'}"></i>
                        </button>
                        <button class="email-action-btn" onclick="replyEmail(${email.id})" title="Reply">
                            <i class="fas fa-reply"></i>
                        </button>
                        <button class="email-action-btn" onclick="deleteEmail(${email.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                emailItem.addEventListener('click', () => selectEmail(email.id));
                emailList.appendChild(emailItem);
            });
        }

        // Select email
        async function selectEmail(emailId) {
            try {
                console.log('Selecting email with ID:', emailId, 'Current folder:', currentFolder);
                
                document.querySelectorAll('.email-item').forEach(item => item.classList.remove('selected'));
                document.querySelector(`[data-email-id="${emailId}"]`).classList.add('selected');
                
                const email = await apiCall(`/emails/${emailId}`);
                selectedEmail = email;
                renderEmailDetail(email);
                
                if (currentFolder !== 'sent' && !email.is_read) {
                    await apiCall(`/emails/${emailId}/read`, { method: 'PUT' });
                    loadEmails(currentFolder);
                }
                
                if (window.innerWidth <= 768) {
                    document.getElementById('email-detail').classList.add('show');
                }
            } catch (error) {
                console.error('Failed to load email:', error);
                showToast('Failed to load email', 'error');
            }
        }

        // Render email detail
        function renderEmailDetail(email) {
            const emailDetail = document.getElementById('email-detail');
            const timeAgo = getTimeAgo(email.created_at);
            
            const displayName = currentFolder === 'sent' 
                ? (email.recipient_name || email.recipient_email || 'Unknown Recipient')
                : (email.sender_username || email.recipient_username || 'Unknown Sender');
            
            const displayEmail = currentFolder === 'sent'
                ? email.recipient_email
                : (email.sender_email || email.recipient_email);
            
            // Security analysis
            const securityInfo = analyzeEmailSecurity(email);
            
            emailDetail.innerHTML = `
                <div class="email-detail-header">
                    <div class="email-detail-subject">${email.subject}</div>
                    <div class="email-detail-meta">
                        <div class="email-sender-info">
                            <div class="sender-avatar">${displayName.charAt(0).toUpperCase()}</div>
                            <div class="sender-details">
                                <h4>${displayName}</h4>
                                <p>${displayEmail}</p>
                                ${currentFolder === 'sent' && email.smtp_status ? `<p style="font-size: 12px; color: var(--text-muted);">Status: ${email.smtp_status}</p>` : ''}
                                ${securityInfo.hasTrackers ? `<p style="font-size: 12px; color: #dc3545;"><i class="fas fa-exclamation-triangle"></i> Trackers detected and blocked</p>` : ''}
                                ${securityInfo.isEncrypted ? `<p style="font-size: 12px; color: #28a745;"><i class="fas fa-lock"></i> End-to-end encrypted</p>` : ''}
                            </div>
                        </div>
                        <div class="email-detail-time">${timeAgo}</div>
                    </div>
                </div>
                <div class="email-detail-body">
                    ${email.body.replace(/\n/g, '<br>')}
                </div>
                <div class="email-detail-actions">
                    <button class="action-btn" onclick="replyEmail(${email.id})">
                        <i class="fas fa-reply"></i>
                        Reply
                    </button>
                    <button class="action-btn" onclick="forwardEmail(${email.id})">
                        <i class="fas fa-share"></i>
                        Forward
                    </button>
                    <button class="action-btn" onclick="starEmail(${email.id})">
                        <i class="fas fa-star ${email.is_starred ? 'fas' : 'far'}"></i>
                        ${email.is_starred ? 'Unstar' : 'Star'}
                    </button>
                    <button class="action-btn" onclick="deleteEmail(${email.id})">
                        <i class="fas fa-trash"></i>
                        Delete
                    </button>
                </div>
            `;
        }

        // Analyze email security
        function analyzeEmailSecurity(email) {
            const body = email.body || '';
            const subject = email.subject || '';
            
            const trackers = [
                'pixel', 'beacon', 'tracking', 'analytics',
                'utm_source', 'utm_medium', 'utm_campaign',
                'click', 'open', 'read'
            ];
            
            const hasTrackers = trackers.some(tracker => 
                body.toLowerCase().includes(tracker) || 
                subject.toLowerCase().includes(tracker)
            );
            
            // Simulate encryption status (in real implementation, this would check actual encryption)
            const isEncrypted = Math.random() > 0.3; // 70% chance of being encrypted
            
            return {
                hasTrackers,
                isEncrypted,
                securityScore: hasTrackers ? 60 : (isEncrypted ? 95 : 80)
            };
        }

        // Email actions
        async function starEmail(emailId) {
            try {
                await apiCall(`/emails/${emailId}/star`, { method: 'PUT' });
                showToast('Email starred successfully', 'success');
                loadEmails(currentFolder);
            } catch (error) {
                showToast('Failed to star email', 'error');
            }
        }

        async function replyEmail(emailId) {
            showToast('Reply feature coming soon!', 'warning');
        }

        async function forwardEmail(emailId) {
            showToast('Forward feature coming soon!', 'warning');
        }

        async function deleteEmail(emailId) {
            if (confirm('Are you sure you want to delete this email?')) {
                try {
                    await apiCall(`/emails/${emailId}`, { method: 'DELETE' });
                    showToast('Email deleted successfully', 'success');
                    loadEmails(currentFolder);
                } catch (error) {
                    showToast('Failed to delete email', 'error');
                }
            }
        }

        // Utility functions
        function getTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString();
        }

        function updateCounts() {
            const counts = {
                inbox: emails.filter(e => !e.is_read).length,
                sent: emails.length,
                starred: emails.filter(e => e.is_starred).length,
                drafts: 0,
                important: 0,
                trash: 0
            };

            Object.keys(counts).forEach(folder => {
                const element = document.getElementById(`${folder}-count`);
                if (element) {
                    element.textContent = counts[folder];
                }
            });
        }

        // Mobile menu toggle
        document.getElementById('mobile-menu-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('show');
        });

        // Event listeners
        document.getElementById('compose-btn').addEventListener('click', function() {
            window.open('/compose-enhanced.html', '_blank', 'width=1000,height=800,scrollbars=yes,resizable=yes');
        });

        document.getElementById('user-menu').addEventListener('click', function() {
            if (confirm('Do you want to logout?')) {
                localStorage.removeItem('taumail_token');
                localStorage.removeItem('taumail_user');
                window.location.href = '/';
            }
        });

        // Folder navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const folder = this.dataset.folder;
                if (folder) {
                    currentFolder = folder;
                    
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    
                    loadEmails(folder);
                    
                    document.getElementById('sidebar').classList.remove('show');
                }
            });
        });

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const emailItems = document.querySelectorAll('.email-item');
            
            emailItems.forEach(item => {
                const sender = item.querySelector('.email-sender').textContent.toLowerCase();
                const subject = item.querySelector('.email-subject').textContent.toLowerCase();
                const preview = item.querySelector('.email-preview').textContent.toLowerCase();
                
                if (sender.includes(query) || subject.includes(query) || preview.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Initialize
        loadEmails();
    </script>
</body>
</html>
