global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # TauCore API Metrics (Production)
  - job_name: 'tauos-api'
    static_configs:
      - targets: ['tauos.vercel.app']
    metrics_path: '/api/monitoring/metrics'
    params:
      format: ['prometheus']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https

  # TauCore Health Check (Production)
  - job_name: 'tauos-health'
    static_configs:
      - targets: ['tauos.vercel.app']
    metrics_path: '/api/health'
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https
