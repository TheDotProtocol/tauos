apiVersion: 1

groups:
  - name: tauos-critical-alerts
    org_id: 1
    rules:
      - uid: tauos-api-down
        title: TauCore API Down
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasource:
              type: prometheus
              uid: prometheus
            model:
              expr: up{job="tauos-api"} == 0
              interval: ''
              refId: A
        no_data_state: NoData
        exec_err_state: Alerting
        for: 1m
        annotations:
          summary: TauCore API is down
          description: The TauCore API has been down for more than 1 minute
        labels:
          severity: critical
        notification_uid: tauos-email

      - uid: tauos-high-error-rate
        title: High Error Rate
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasource:
              type: prometheus
              uid: prometheus
            model:
              expr: rate(http_requests_total{job="tauos-api",status=~"5.."}[5m]) > 0.1
              interval: ''
              refId: A
        no_data_state: NoData
        exec_err_state: Alerting
        for: 2m
        annotations:
          summary: High error rate detected
          description: Error rate is above 10% for more than 2 minutes
        labels:
          severity: warning
        notification_uid: tauos-email

      - uid: tauos-high-response-time
        title: High Response Time
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasource:
              type: prometheus
              uid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="tauos-api"}[5m])) > 2
              interval: ''
              refId: A
        no_data_state: NoData
        exec_err_state: Alerting
        for: 3m
        annotations:
          summary: High response time detected
          description: 95th percentile response time is above 2 seconds
        labels:
          severity: warning
        notification_uid: tauos-email

      - uid: tauos-database-down
        title: Database Down
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasource:
              type: prometheus
              uid: prometheus
            model:
              expr: up{job="tauos-health"} == 0
              interval: ''
              refId: A
        no_data_state: NoData
        exec_err_state: Alerting
        for: 1m
        annotations:
          summary: Database is down
          description: The TauCore database has been down for more than 1 minute
        labels:
          severity: critical
        notification_uid: tauos-email
