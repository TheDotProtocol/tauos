# TauOS Wi-Fi Driver Configuration
# Universal Wi-Fi support for ANY machine

# Intel Wi-Fi support (most common)
CONFIG_IWLWIFI=y
CONFIG_IWLMVM=y
CONFIG_IWLMEI=y
CONFIG_IWLWIFI_DEBUG=y

# Realtek Wi-Fi support (very common)
CONFIG_RTL8188EU=y
CONFIG_RTL8192CU=y
CONFIG_RTL8192DU=y
CONFIG_RTL8192EU=y
CONFIG_RTL8812AU=y
CONFIG_RTL8821CU=y
CONFIG_RTL8822BU=y

# Broadcom Wi-Fi support (Apple, many laptops)
CONFIG_BRCMFMAC=y
CONFIG_BRCMUTIL=y
CONFIG_BRCMFMAC_PROTO_BCDC=y
CONFIG_BRCMFMAC_PROTO_MSGBUF=y

# Qualcomm Wi-Fi support (Snapdragon, ARM devices)
CONFIG_ATH10K=y
CONFIG_ATH10K_PCI=y
CONFIG_ATH10K_AHB=y
CONFIG_ATH10K_SDIO=y

# MediaTek Wi-Fi support (budget devices)
CONFIG_MT76=y
CONFIG_MT7601U=y
CONFIG_MT7615E=y
CONFIG_MT7915E=y
CONFIG_MT7921E=y

# Universal Wi-Fi support
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_WIRELESS=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_WLAN_VENDOR_QUALCOMM=y
CONFIG_WLAN_VENDOR_MEDIATEK=y
