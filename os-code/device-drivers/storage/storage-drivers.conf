# TauOS Storage Driver Configuration
# Universal Storage support for ANY machine

# SATA support (most common)
CONFIG_ATA=y
CONFIG_ATA_SFF=y
CONFIG_ATA_PIIX=y
CONFIG_SATA_AHCI=y
CONFIG_SATA_AHCI_PLATFORM=y
CONFIG_SATA_SIL24=y

# NVMe support (modern SSDs)
CONFIG_NVME_CORE=y
CONFIG_NVME_FABRICS=y
CONFIG_NVME_PCI=y
CONFIG_NVME_TCP=y
CONFIG_NVME_RDMA=y

# USB Storage support
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
CONFIG_USB_STORAGE_DEBUG=y

# SD Card support (mobile, cameras)
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_SDHCI_ACPI=y

# eMMC support (embedded devices)
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_OF_ARASAN=y

# SCSI support (enterprise storage)
CONFIG_SCSI=y
CONFIG_SCSI_MOD=y
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y
CONFIG_CHR_DEV_SG=y

# Universal Storage support
CONFIG_BLOCK=y
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_BSG=y
CONFIG_BLK_DEV_LOOP=y
