name: Build Tau Browser

on:
  push:
    tags:
      - 'taubrowser-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            name: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            name: macos
          - platform: ubuntu-22.04
            target: ''
            args: ''
            name: linux
          - platform: windows-latest
            target: ''
            args: ''
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target (macOS cross)
        if: matrix.platform == 'macos-latest' && matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        working-directory: apps/taubrowser-desktop
        run: npm install

      - name: Build Tau Browser
        working-directory: apps/taubrowser-desktop
        run: npm run build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taubrowser-${{ matrix.name }}
          path: apps/taubrowser-desktop/src-tauri/target/**/release/bundle/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/taubrowser-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List bundles
        run: find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
            | while IFS= read -r -d '' f; do
                base="$(basename "$f")"
                # Match download URLs: TauBrowser_* (no space in filename)
                out="${base/Tau Browser_/TauBrowser_}"
                cp "$f" "release/$out"
                echo "  $out"
              done
          ls -lah release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tau Browser ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Tauri CLI
        working-directory: apps/taubrowser-desktop
        run: npm install
      - name: Init Android (if needed)
        working-directory: apps/taubrowser-desktop
        run: npx tauri android init || true
      - name: Build Android APK
        working-directory: apps/taubrowser-desktop
        run: npx tauri android build || echo "Android build requires signing keys — see docs/phase-2-taubrowser.md"
