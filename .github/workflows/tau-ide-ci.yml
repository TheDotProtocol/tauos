name: Tau IDE CI

on:
  push:
    branches: [main, beta/tau-ide, release/tau-ide-*]
    paths:
      - 'src/app/developers/**'
      - 'src/app/api/tau-ide/**'
      - 'src/app/api/developers/tauscript/**'
      - 'src/lib/tau-ide/**'
      - 'src/lib/tauscript/**'
      - 'src/lib/taupm/**'
      - 'src/components/tau-ide/**'
      - 'scripts/tau-ide-*.mjs'
      - 'scripts/tau-cli.ts'
      - 'package.json'
      - '.github/workflows/tau-ide-ci.yml'
  pull_request:
    paths:
      - 'src/app/developers/**'
      - 'src/app/api/tau-ide/**'
      - 'src/app/api/developers/tauscript/**'
      - 'src/lib/tau-ide/**'
      - 'src/lib/tauscript/**'
      - 'src/components/tau-ide/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run tau-ide:test:unit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-long
          TAU_IDE_SECRETS_KEY: ci-test-secrets-key-minimum-32-characters

  integration:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tau
          POSTGRES_PASSWORD: tau
          POSTGRES_DB: tauide
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Setup Tau IDE schema
        run: npm run tau-ide:setup
        env:
          DATABASE_URL: postgresql://tau:tau@localhost:5432/tauide
      - name: Build for integration
        run: npm run build
        env:
          DATABASE_URL: postgresql://tau:tau@localhost:5432/tauide
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-long
          TAU_IDE_SECRETS_KEY: ci-test-secrets-key-minimum-32-characters
