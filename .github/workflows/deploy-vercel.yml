name: Deploy to Vercel (Optional)

# Production deploys via Vercel Git integration on push to main (project: tauos).
# This workflow is informational only — no checkout or sub-project deploy needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deployment status
        run: |
          echo "Push received on main."
          echo "Production: Vercel Git integration deploys the tauos project (www.tauos.org)."
          echo "TauCloud, TauMail, TauID, and APIs are served from the root Next.js app."
          echo "Legacy vercel-tauos-cloud / vercel-tauos-mail subfolders were removed; Railway is optional for backend workers."
