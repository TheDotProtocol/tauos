<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="messagesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <filter id="messagesGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#messagesGradient)"/>
  
  <!-- Message bubble -->
  <path d="M16 20 L48 20 C50 20 52 22 52 24 L52 32 C52 34 50 36 48 36 L32 36 L24 44 L24 36 L16 36 C14 36 12 34 12 32 L12 24 C12 22 14 20 16 20 Z" fill="white" filter="url(#messagesGlow)"/>
  
  <!-- Message text lines -->
  <rect x="20" y="26" width="24" height="2" rx="1" fill="url(#messagesGradient)" opacity="0.6"/>
  <rect x="20" y="30" width="20" height="2" rx="1" fill="url(#messagesGradient)" opacity="0.4"/>
  <rect x="20" y="34" width="16" height="2" rx="1" fill="url(#messagesGradient)" opacity="0.4"/>
  
  <!-- Notification dot -->
  <circle cx="44" cy="20" r="4" fill="#EF4444"/>
  <text x="44" y="24" font-family="Arial" font-size="8" fill="white" text-anchor="middle">3</text>
  
  <!-- Shine effect -->
  <rect x="16" y="20" width="32" height="8" rx="4" fill="white" opacity="0.1"/>
</svg>
