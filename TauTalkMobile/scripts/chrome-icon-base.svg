<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <linearGradient id="shine1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="shine2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C8940A"/>
    </linearGradient>
    <linearGradient id="shine3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <!-- Full-bleed ring segments (Chrome geometry: 120deg annular wedges) -->
    <path fill="url(#shine1)" d="M 256,138 L 256,0 A 256,256 0 0 1 477.73,384 L 358.19,315 A 118,118 0 0 0 256,138 Z"/>
    <path fill="url(#shine2)" d="M 358.19,315 L 477.73,384 A 256,256 0 0 1 34.27,384 L 153.81,315 A 118,118 0 0 0 358.19,315 Z"/>
    <path fill="url(#shine3)" d="M 153.81,315 L 34.27,384 A 256,256 0 0 1 256,0 L 256,138 A 118,118 0 0 0 153.81,315 Z"/>

    <!-- Chrome-style white separator ring -->
    <circle cx="256" cy="256" r="118" fill="#FFFFFF"/>

    <!-- Inner hub (Chrome blue circle equivalent) -->
    <circle cx="256" cy="256" r="108" fill="url(#innerGlow)"/>
  </g>
</svg>
