# TF-2 PIPELINE SMOKE TEST config — tiny HF test model, not a quality benchmark

adapter_id: smoke-tiny
base_model_id: hf-internal-testing/tiny-random-LlamaForCausalLM
base_model_revision: null
training_method: lora_sft
smoke_mode: true

max_seq_length: 128
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0005
num_train_epochs: 1
max_steps: 2
seed: 42

lora:
  r: 4
  lora_alpha: 8
  lora_dropout: 0.0
  bias: none
  task_type: CAUSAL_LM
