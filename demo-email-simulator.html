<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TauMail Demo Email Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .preset-btn {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 TauMail Demo Email Simulator</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            Simulate incoming emails for investor demos and testing
        </p>

        <div class="preset-buttons">
            <button class="preset-btn" onclick="loadPreset('investor')">Investor Email</button>
            <button class="preset-btn" onclick="loadPreset('customer')">Customer Support</button>
            <button class="preset-btn" onclick="loadPreset('partnership')">Partnership</button>
            <button class="preset-btn" onclick="loadPreset('media')">Media Inquiry</button>
        </div>

        <form id="emailForm">
            <div class="form-group">
                <label for="from">From Email:</label>
                <input type="email" id="from" name="from" value="investor@techcrunch.com" required>
            </div>

            <div class="form-group">
                <label for="senderName">Sender Name:</label>
                <input type="text" id="senderName" name="senderName" value="TechCrunch Editorial" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" value="Partnership Opportunity - TechCrunch Coverage" required>
            </div>

            <div class="form-group">
                <label for="body">Email Body:</label>
                <textarea id="body" name="body" required>Dear TauOS Team,

We at TechCrunch are excited about your privacy-first operating system and would love to feature TauOS in our upcoming coverage of innovative tech startups.

Your approach to user privacy and AI-native computing aligns perfectly with current market trends. We believe our readers would be very interested in learning more about TauOS.

Would you be available for an interview next week to discuss your vision for the future of computing?

Best regards,
Sarah Johnson
Senior Editor, TechCrunch</textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                📨 Simulate Incoming Email
            </button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const presets = {
            investor: {
                from: 'investor@sequoiacap.com',
                senderName: 'Sequoia Capital',
                subject: 'Series A Investment Opportunity',
                body: `Dear TauOS Team,

We at Sequoia Capital are impressed by your innovative approach to privacy-first computing. Your traction and vision align perfectly with our investment thesis.

We would like to discuss a potential Series A investment of $10M to accelerate your global expansion.

Are you available for a meeting next week?

Best regards,
Michael Chen
Partner, Sequoia Capital`
            },
            customer: {
                from: 'support@microsoft.com',
                senderName: 'Microsoft Support',
                subject: 'Enterprise Partnership Inquiry',
                body: `Hello TauOS Team,

Microsoft is interested in exploring a strategic partnership with TauOS. Your privacy-first approach complements our enterprise security solutions.

We would like to discuss integration possibilities and potential collaboration opportunities.

Please let us know your availability for a technical discussion.

Regards,
Alex Rodriguez
Enterprise Partnerships, Microsoft`
            },
            partnership: {
                from: 'partnerships@apple.com',
                senderName: 'Apple Partnerships',
                subject: 'App Store Integration Discussion',
                body: `Dear TauOS Development Team,

Apple is interested in featuring TauOS applications in our App Store. Your privacy-focused approach aligns with our user protection values.

We would like to discuss integration requirements and potential revenue sharing opportunities.

Please schedule a call with our partnership team.

Best regards,
Jennifer Liu
App Store Partnerships, Apple`
            },
            media: {
                from: 'press@wired.com',
                senderName: 'WIRED Magazine',
                subject: 'Feature Article Request',
                body: `Hello TauOS Team,

WIRED is planning a feature article on next-generation operating systems and would love to include TauOS.

Your innovative approach to AI-native computing is exactly what our readers want to learn about.

Are you available for an interview this month?

Best regards,
David Kim
Senior Writer, WIRED`
            }
        };

        function loadPreset(type) {
            const preset = presets[type];
            document.getElementById('from').value = preset.from;
            document.getElementById('senderName').value = preset.senderName;
            document.getElementById('subject').value = preset.subject;
            document.getElementById('body').value = preset.body;
        }

        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '📤 Sending...';
            statusDiv.innerHTML = '';

            try {
                const formData = new FormData(e.target);
                const data = {
                    from: formData.get('from'),
                    senderName: formData.get('senderName'),
                    subject: formData.get('subject'),
                    body: formData.get('body')
                };

                const response = await fetch('/api/taumail/demo/simulate-incoming', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Email simulated successfully!<br>
                            Email ID: ${result.emailId}<br>
                            <a href="/taumail/inbox" target="_blank" style="color: #155724; text-decoration: underline;">
                                View in TauMail Inbox →
                            </a>
                        </div>
                    `;
                    e.target.reset();
                } else {
                    statusDiv.innerHTML = `
                        <div class="status error">
                            ❌ Error: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ Network Error: ${error.message}
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📨 Simulate Incoming Email';
            }
        });
    </script>
</body>
</html>
