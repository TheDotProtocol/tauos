<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mailGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#mailGradient)"/>
  
  <!-- Mail envelope -->
  <path d="M16 24 L32 36 L48 24" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="16" y="20" width="32" height="24" rx="2" stroke="white" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Mail details -->
  <circle cx="24" cy="28" r="2" fill="white" opacity="0.8"/>
  <circle cx="40" cy="28" r="2" fill="white" opacity="0.8"/>
  <path d="M20 32 L44 32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Shine effect -->
  <rect x="16" y="20" width="32" height="8" rx="2" fill="white" opacity="0.1"/>
</svg>
