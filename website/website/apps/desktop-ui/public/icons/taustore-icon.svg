<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="storeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="storeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#storeGradient)"/>
  
  <!-- Store bag -->
  <path d="M20 20 L44 20 C46 20 48 22 48 24 L48 40 C48 42 46 44 44 44 L20 44 C18 44 16 42 16 40 L16 24 C16 22 18 20 20 20 Z" fill="white" filter="url(#storeGlow)"/>
  
  <!-- Store handle -->
  <path d="M28 20 L28 16 C28 14 30 12 32 12 C34 12 36 14 36 16 L36 20" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#storeGlow)"/>
  
  <!-- Store details -->
  <rect x="22" y="26" width="20" height="12" rx="1" fill="url(#storeGradient)"/>
  <path d="M24 28 L40 28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24 32 L40 32" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24 36 L40 36" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Shine effect -->
  <rect x="20" y="20" width="24" height="8" rx="2" fill="white" opacity="0.1"/>
</svg>
