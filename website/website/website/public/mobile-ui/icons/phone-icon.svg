<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="phoneGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#phoneGradient)"/>
  
  <!-- Phone body -->
  <rect x="20" y="12" width="24" height="40" rx="6" fill="white" filter="url(#phoneGlow)"/>
  
  <!-- Phone screen -->
  <rect x="22" y="16" width="20" height="32" rx="4" fill="url(#phoneGradient)"/>
  
  <!-- Phone details -->
  <rect x="30" y="14" width="4" height="2" rx="1" fill="white" opacity="0.8"/>
  <circle cx="32" cy="44" r="2" fill="white" opacity="0.6"/>
  
  <!-- Call icon -->
  <path d="M28 24 L36 24 L36 28 L28 28 Z" fill="white" opacity="0.8"/>
  <path d="M28 30 L36 30 L36 34 L28 34 Z" fill="white" opacity="0.6"/>
  <path d="M28 36 L36 36 L36 40 L28 40 Z" fill="white" opacity="0.6"/>
  
  <!-- Shine effect -->
  <rect x="20" y="12" width="24" height="8" rx="6" fill="white" opacity="0.1"/>
</svg>