<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="browserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="browserGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#browserGradient)"/>
  
  <!-- Browser window -->
  <rect x="16" y="20" width="32" height="24" rx="2" fill="white" filter="url(#browserGlow)"/>
  
  <!-- Browser header -->
  <rect x="16" y="20" width="32" height="6" rx="2" fill="url(#browserGradient)"/>
  
  <!-- Browser controls -->
  <circle cx="20" cy="23" r="1" fill="white" opacity="0.8"/>
  <circle cx="24" cy="23" r="1" fill="white" opacity="0.6"/>
  <circle cx="28" cy="23" r="1" fill="white" opacity="0.4"/>
  
  <!-- Browser content -->
  <rect x="18" y="28" width="28" height="2" rx="1" fill="url(#browserGradient)" opacity="0.3"/>
  <rect x="18" y="32" width="24" height="2" rx="1" fill="url(#browserGradient)" opacity="0.2"/>
  <rect x="18" y="36" width="26" height="2" rx="1" fill="url(#browserGradient)" opacity="0.2"/>
  
  <!-- Globe icon -->
  <circle cx="32" cy="30" r="3" fill="white" opacity="0.6"/>
  <path d="M29 30 L35 30 M32 27 L32 33" stroke="url(#browserGradient)" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Shine effect -->
  <rect x="16" y="20" width="32" height="6" rx="2" fill="white" opacity="0.1"/>
</svg>
