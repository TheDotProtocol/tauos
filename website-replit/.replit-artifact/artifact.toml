kind = "web"
previewPath = "/"
title = "TAU CORE™ Official Website"
version = "1.0.0"
id = "artifacts/tau-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22966

[services.development]
run = "pnpm --filter @workspace/tau-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tau-website", "run", "build" ]
publicDir = "artifacts/tau-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22966"
BASE_PATH = "/"
