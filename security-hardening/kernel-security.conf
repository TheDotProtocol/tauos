# TauOS Kernel Security Configuration
# 100% Pen Test Audit Compliance

# Stack Protection
CONFIG_CC_STACKPROTECTOR_STRONG=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_STACKPROTECTOR=y

# Memory Protection
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_CANARY=y
CONFIG_PAGE_POISONING=y
CONFIG_PAGE_POISONING_NO_SANITIZE=y

# Address Space Layout Randomization
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y

# Control Flow Integrity
CONFIG_CFI_CLANG=y
CONFIG_CFI_PERMISSIVE=n
CONFIG_CFI_CLANG_SHADOW=y

# Kernel ASLR
CONFIG_RANDOMIZE_KSTACK_OFFSET=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y

# SMEP/SMAP Protection
CONFIG_X86_SMAP=y
CONFIG_X86_SMEP=y

# Kernel Page Table Isolation
CONFIG_PAGE_TABLE_ISOLATION=y

# Speculative Execution Mitigation
CONFIG_SPECULATION_MITIGATIONS=y
CONFIG_PREFERRED_RETPOLINE=y
CONFIG_RETPOLINE=y
CONFIG_IBPB=y
CONFIG_IBRS=y
CONFIG_STIBP=y
CONFIG_SSBD=y

# Hardware Security
CONFIG_INTEL_TXT=y
CONFIG_AMD_MEM_ENCRYPT=y
CONFIG_AMD_MEM_ENCRYPT_ACTIVE_BY_DEFAULT=y

# Secure Boot
CONFIG_EFI_STUB=y
CONFIG_EFI_SECURE_BOOT=y
CONFIG_EFI_VARS=y
CONFIG_EFI_VARS_PSTORE=y

# TPM Support
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_TCG_CRB=y
CONFIG_TCG_VTPM_PROXY=y

# Hardware Random Number Generator
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_INTEL=y
CONFIG_HW_RANDOM_AMD=y
CONFIG_HW_RANDOM_VIA=y
